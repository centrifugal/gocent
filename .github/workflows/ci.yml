name: CI

on: [push, pull_request]

permissions:
  contents: read

# Every job runs Makefile targets, so what passes locally passes here.
#
# Each job skips a pull request from this repository's own branches, which the
# push already ran.
#
# setup-go runs with `cache: false`: its cache is keyed on go.sum, and this
# module has no dependencies and so no go.sum.

jobs:
  test:
    name: test (${{ matrix.os }})
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # The Makefile recipes are POSIX sh, so Windows runs them under Git Bash.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install make
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - run: make build
      - run: make test-race

  check:
    name: check (lint, generated code, coverage, vulnerabilities)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: make check

  integration:
    name: integration (Centrifugo)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # The same setup as testdata/centrifugo.json, through Centrifugo's
    # environment variables.
    services:
      centrifugo:
        image: centrifugo/centrifugo:v6
        ports:
          - 8100:8000
        env:
          CENTRIFUGO_HTTP_API_KEY: api_key
          CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_HISTORY_SIZE: "1000"
          CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_HISTORY_TTL: 300s
          CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_PRESENCE: "true"
          CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: client_secret
          CENTRIFUGO_UNI_HTTP_STREAM_ENABLED: "true"
          CENTRIFUGO_SHARED_POLL_HMAC_SECRET_KEY: shared_poll_secret
          CENTRIFUGO_CHANNEL_PROXY_SHARED_POLL_REFRESH_ENDPOINT: http://localhost:3000/shared_poll_refresh
          CENTRIFUGO_CHANNEL_NAMESPACES: >-
            [{"name":"map","subscription_type":"map","map":{"mode":"recoverable","key_ttl":"60s","stream_size":100,"stream_ttl":"300s","meta_ttl":"600s"}},
            {"name":"poll","subscription_type":"shared_poll","shared_poll":{"mode":"versioned","publish_enabled":true}}]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: make test-integration

  fuzz:
    name: fuzz
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: make fuzz FUZZTIME=1m
